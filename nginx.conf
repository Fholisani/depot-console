# Serves the Console at /depot-console/ (the build's base href). Runs as the unprivileged nginx user
# on 8080. Client-side routes fall back to index.html; index.html and the runtime JSON files are never
# cached so a deploy is picked up at once, while hashed bundles are cached for a year.
#
# Link previews (task 39.16): chat apps read og: tags from a link's HTML and do not run JavaScript, so
# their requests for a share link /depot-console/s/<token> get the API's preview page instead, and
# /depot-console/s/<token>/cover.jpg is the link's picture. A link with ?slot=passive is sent to the
# passive API (X-Slot: Passive), because crawlers do not carry the passive cookie.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Link-preview crawlers of chat and social apps.
    map $http_user_agent $preview_bot {
        default 0;
        "~*(whatsapp|facebookexternalhit|facebot|twitterbot|telegrambot|slackbot|discordbot|linkedinbot|skypeuripreview|pinterest|redditbot|applebot|googlebot|bingbot|embedly|iframely|vkshare|viber|snapchat|mastodon|bitlybot|signal)" 1;
    }
    # Which API slot a share link belongs to: ?slot=passive links live on the passive data.
    map $arg_slot $share_slot {
        default "";
        passive Passive;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/conf.d/depot-api.conf;
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 302 /depot-console/;
        }

        location = /depot-console {
            return 301 /depot-console/;
        }

        # A share link: crawlers get the preview page, people get the app.
        location ~ "^/depot-console/s/(?<share_token>[A-Za-z0-9_-]{16,64})/?$" {
            error_page 418 = @share_card;
            if ($preview_bot) {
                return 418;
            }
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # The link's picture for previews (a redirect to its 480 px thumbnail).
        location ~ "^/depot-console/s/(?<share_token>[A-Za-z0-9_-]{16,64})/cover\.jpg$" {
            proxy_pass $depot_api_origin/v1/share/$share_token/thumbnail;
            proxy_set_header X-Slot $share_slot;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_ssl_server_name on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location @share_card {
            proxy_pass $depot_api_origin/v1/share/$share_token/card;
            proxy_set_header X-Slot $share_slot;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_ssl_server_name on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            # If the API cannot be reached, crawlers get the plain app page (a generic preview).
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @app_shell;
        }

        location @app_shell {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /depot-console/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /depot-console/index.html;
        }

        # Always fresh: the app shell and the runtime config.
        location ~ ^/depot-console/(index\.html|config\.json|pricing\.json)$ {
            alias /usr/share/nginx/html/$1;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hashed build output: safe to cache for a year.
        location ~ ^/depot-console/(.+\.(?:js|css|woff2?|ttf|svg|png|jpg|ico))$ {
            alias /usr/share/nginx/html/$1;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
