# Serves the Console at /depot-console/ (the build's base href). Runs as the unprivileged nginx user
# on 8080. Client-side routes fall back to index.html; index.html and the runtime JSON files are never
# cached so a deploy is picked up at once, while hashed bundles are cached for a year.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 302 /depot-console/;
        }

        location = /depot-console {
            return 301 /depot-console/;
        }

        location /depot-console/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /depot-console/index.html;
        }

        # Always fresh: the app shell and the runtime config.
        location ~ ^/depot-console/(index\.html|config\.json|pricing\.json)$ {
            alias /usr/share/nginx/html/$1;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hashed build output: safe to cache for a year.
        location ~ ^/depot-console/(.+\.(?:js|css|woff2?|ttf|svg|png|jpg|ico))$ {
            alias /usr/share/nginx/html/$1;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
